defaults:
  - _self_
  - loader: loader
  - loss: scfe_regularization
  - model: bpreactresnet
  - logger: wandb
  - data: cifar10
  - trainer: trainer_default
  - optimizer: adam
  - estimator: latent_scfe
  - preprocessor: preprocessing

# This line ensures the logger uses the correct sweep configuration file
# from the wandb_sweeps_configs directory.
logger:
  config: scfe_resnet_sweep

run_mode: sweep #sweep or run        
project: counterfactual_overfitting_experiments_new
name: experiments
version: 1
seed: 42
device: cuda