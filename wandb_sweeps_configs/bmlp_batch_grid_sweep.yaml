method: grid
name: BMLP_Batch_SCFE_Grid_Sweep
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  estimator.epsilon:
    values: [0, 0.0001, 0.01, 1]
  loss.alpha:
    values: [-0.01, -0.05, -0.1]
  model.model_type:
    values: ["BMLPBatch"]
  loss.type:
    values: ["scfe_regularization"]
  estimator.type:
    values: ["latent_scfe"]
