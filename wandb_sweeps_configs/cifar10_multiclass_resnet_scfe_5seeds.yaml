method: grid
name: CIFAR10_Multiclass_ResNet_SCFE_5Seeds
metric:
  goal: maximize
  name: validation/accuracy
parameters:
  seed:
    values:
      - 42
      - 43
      - 44
      - 45
      - 46
  loss:
    values:
      - {type: scfe_regularization, alpha: -1.0966156860342264e-05, binary: False}
  model:
    values:
      - {model_type: PreActResNet}
  data:
    values:
      - {make_binary: False}
  trainer:
    values:
      - {max_epochs: 200}
